<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>ギフト芸図鑑</title>
<style>
:root{--bg:#fff8fc;--card:#fff;--ink:#2e2730;--muted:#817581;--line:#f0dfe8;--soft:#fff0f6;--lav:#f5f0ff;--shadow:0 10px 30px rgba(70,42,58,.07)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#fff3fb 0,#fffafd 30%,#fff8fc 100%);color:var(--ink)}
.wrap{max-width:860px;margin:auto;padding:18px 14px 90px}.hero{padding:10px 4px 14px}.kicker{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted)}
h1{font-size:34px;margin:12px 0 6px;line-height:1.1}.sub{color:var(--muted);line-height:1.65;font-size:14px}
.sticky{position:sticky;top:0;z-index:20;background:rgba(255,248,252,.94);backdrop-filter:blur(15px);padding:10px 0}
.search{width:100%;border:1.5px solid var(--line);border-radius:18px;padding:15px 16px;font-size:16px;background:#fff;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800;color:var(--muted)}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;padding:8px 2px 12px;color:var(--muted);font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;gap:10px}.title{font-size:19px;font-weight:900;line-height:1.35}.badge{font-size:11px;font-weight:900;background:var(--soft);padding:6px 9px;border-radius:999px;color:#af3f72}
.label{font-size:12px;font-weight:900;color:var(--muted);margin-top:14px}.bubble{margin-top:7px;padding:12px 13px;border-radius:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;font-size:15px}.shuri{background:var(--lav)}.people{background:var(--soft)}
.line-list{display:flex;flex-direction:column;gap:8px;margin-top:7px}.line-row{display:flex;align-items:flex-start;gap:8px;background:var(--soft);border-radius:15px;padding:10px 10px 10px 12px;border:1px solid #ffd7e8}.line-text{flex:1;line-height:1.5;word-break:break-word;white-space:pre-wrap;font-size:15px}
.copy{border:0;border-radius:11px;background:var(--ink);color:#fff;padding:9px 11px;font-size:12px;font-weight:800;white-space:nowrap}.like-btn{border:1px solid #ffcfe1;background:#fff;color:#a63868;border-radius:11px;padding:9px 10px;font-size:12px;font-weight:900;white-space:nowrap}.like-btn.on{background:#ffedf5;border-color:#ff91bb;color:#a3235e}.line-actions{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.actions{margin-top:12px}.actions .copy{width:100%;padding:12px}.hint{font-size:12px;color:var(--muted);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(15px);background:#222;color:#fff;padding:10px 14px;border-radius:999px;opacity:0;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.card.wide{grid-column:1/-1}}

.rank-section{margin:4px 0 14px;background:linear-gradient(180deg,#fff,#fff6fb);border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow)}
.rank-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.rank-title{font-size:18px;font-weight:900}.rank-note{font-size:11px;color:var(--muted);text-align:right}
.rank-list{display:grid;gap:8px;margin-top:10px}
.rank-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.rank-num{font-weight:900;text-align:center}.rank-name{font-weight:800;min-width:0;word-break:break-word}.rank-count{font-size:12px;color:var(--muted);font-weight:800}
.recommend-btn{margin-top:12px;width:100%;border:1px solid #ffcfe1;background:#fff6fa;color:#a63868;border-radius:13px;padding:11px 12px;font-weight:900;font-size:13px}
.recommend-btn.on{background:#ffedf5;border-color:#ff91bb;color:#a3235e}
.recommend-btn:disabled{opacity:.5}
.rank-setup{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}


.vote-status{margin:8px 2px 0;font-size:12px;color:var(--muted);line-height:1.5}
.vote-status.ok{color:#237a45}
.vote-status.err{color:#b42318;background:#fff1f0;border:1px solid #ffd0cc;border-radius:10px;padding:8px}

</style>
</head>
<body>
<div class="wrap">
<section class="hero"><div class="kicker">🐰 しゅりりりりりり。配信</div><h1>🎁 ギフト芸図鑑</h1><div class="sub">ギフト芸・弾幕・コールのお約束まとめ。<br>探して、必要な返しをワンタップでコピーできます。</div></section>
<div class="sticky">
<input id="search" class="search" type="search" placeholder="ギフト名・セリフ・返しで検索">
<div id="chips" class="chips"></div><div id="voteStatus" class="vote-status">♡機能を接続中…</div>
</div>
<div class="toolbar"><span id="count"></span><span>タップでコピーできます</span></div>
<div id="grid" class="grid"></div>
</div>
<div id="toast" class="toast">コピーしました ✓</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="recommend-config.js"></script>
<script src="gifts.js"></script>
<script>
const RAW=window.GIFT_DATA||[];
function normalizeItem(x){
  const item={...x};
  let opts=Array.isArray(item.responseOptions)?item.responseOptions:[];
  opts=opts.map(v=>String(v||"").trim()).filter(Boolean);
  if(!opts.length && item.response){
    opts=[String(item.response).trim()].filter(Boolean);
  }
  item.responseOptions=opts;
  item.response=opts.join("\n");
  return item;
}
const DATA=RAW.map(normalizeItem);
const categories=["すべて","🔥ランキング",...new Set(DATA.map(x=>x.category))];let current="すべて";
const $=id=>document.getElementById(id),grid=$("grid"),search=$("search"),chips=$("chips"),count=$("count"),toast=$("toast");
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showToast(){toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1200)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}showToast()}
function renderChips(){
  chips.innerHTML=categories.map(c=>`<button class="chip ${c===current?'active':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    current=b.dataset.c;
    renderChips();
    render();
  });
}
function render(){
  if(current==="🔥ランキング"){
    const rows=[...voteCounts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ja"));
    count.textContent=`${rows.length}件`;
    if(!rankingReady){
      grid.innerHTML=`<div class="empty">ランキングを読み込み中…</div>`;
      return;
    }
    if(!rows.length){
      grid.innerHTML=`<div class="empty">まだ♡がありません。好きな返しに最初の1票をどうぞ 🐰</div>`;
      return;
    }
    const medals=["🥇","🥈","🥉"];
    grid.innerHTML=rows.map(([id,n],i)=>{
      const v=decodeVoteId(id);
      return `<article class="card wide">
        <div class="top">
          <div class="title">${i<3?medals[i]:`${i+1}位`} ${esc(v.gift)}</div>
          <div class="badge">♥ ${n}</div>
        </div>
        ${v.phrase?`<div class="label">📣 人気の返し</div><div class="bubble people">${esc(v.phrase)}</div>`:""}
        ${v.phrase?`<div class="actions"><button class="copy all" data-copy="${encodeURIComponent(v.phrase)}">コピー</button></div>`:""}
      </article>`;
    }).join("");
    grid.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(decodeURIComponent(b.dataset.copy)));
    return;
  }

  const q=search.value.trim().toLowerCase();
  const found=DATA.filter(x=>(current==="すべて"||x.category===current)&&(!q||[x.title,x.category,x.shuri,x.response,...x.responseOptions].join(" ").toLowerCase().includes(q)));
  count.textContent=`${found.length}件`;
  if(!found.length){grid.innerHTML=`<div class="empty">見つかりませんでした 🐰</div>`;return}
  grid.innerHTML=found.map(x=>{
    const multi=x.responseOptions.length>1;
    const joined=x.responseOptions.join("\n");
    return `<article class="card ${joined.length>90?'wide':''}">
      <div class="top"><div class="title">${esc(x.title)}</div><div class="badge">${esc(x.category)}</div></div>
      ${x.shuri?`<div class="label">🐰 しゅり</div><div class="bubble shuri">${esc(x.shuri)}</div>`:""}
      ${x.responseOptions.length?`<div class="label">📣 みんな</div>${multi?`<div class="hint">別の言い方ごとにコピーできます</div>`:""}<div class="line-list">${x.responseOptions.map((p,idx)=>`<div class="line-row"><div class="line-text">${multi?`<b>パターン${idx+1}</b><br>`:""}${esc(p)}</div><div class="line-actions"><button class="copy one" data-copy="${encodeURIComponent(p)}">コピー</button><button class="like-btn" data-like="${encodeURIComponent(x.title+"::"+p)}">♡ 0</button></div></div>`).join("")}</div><div class="actions">${multi?`<button class="copy all" data-copy="${encodeURIComponent(joined)}">全部コピー</button>`:""}</div>`:""}
    </article>`}).join("");
  grid.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(decodeURIComponent(b.dataset.copy)));
  bindLikeButtons();
}

let voteClient=null;
let currentUser=null;
let myVotes=new Set();
let voteCounts=new Map();
let rankingReady=false;
let voteInitError="";

function setVoteStatus(text,type=""){
  const el=$("voteStatus");
  if(!el)return;
  el.textContent=text;
  el.className="vote-status"+(type?` ${type}`:"");
}

async function initRecommendations(){
  const cfg=window.RECOMMEND_CONFIG||{};
  rankingReady=false;
  voteInitError="";
  setVoteStatus("♡機能を接続中…");

  if(!window.supabase){
    voteInitError="Supabaseライブラリを読み込めませんでした";
    setVoteStatus("⚠️ "+voteInitError,"err");
    updateLikeButtons();
    return false;
  }

  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey || cfg.supabaseUrl.includes("YOUR_")){
    voteInitError="Supabaseの接続設定が見つかりません";
    setVoteStatus("⚠️ "+voteInitError,"err");
    updateLikeButtons();
    return false;
  }

  try{
    voteClient=window.supabase.createClient(
      cfg.supabaseUrl,
      cfg.supabaseAnonKey,
      {auth:{persistSession:true,autoRefreshToken:true}}
    );

    let {data:{session},error:sessionError}=await voteClient.auth.getSession();
    if(sessionError) throw sessionError;

    if(!session){
      const res=await voteClient.auth.signInAnonymously();
      if(res.error) throw res.error;
      session=res.data.session;
    }

    if(!session || !session.user){
      throw new Error("匿名ユーザーを作成できませんでした");
    }

    currentUser=session.user;
    rankingReady=true;
    setVoteStatus("♡ 投票できます","ok");
    await loadVotes();
    return true;
  }catch(e){
    console.error("Supabase init error:",e);
    voteInitError=e?.message||String(e);
    rankingReady=false;
    setVoteStatus("⚠️ ♡接続エラー："+voteInitError,"err");
    updateLikeButtons();
    return false;
  }
}

async function loadVotes(){
  if(!voteClient || !currentUser)return;

  const {data,error}=await voteClient
    .from("gift_votes")
    .select("gift_id,user_id");

  if(error)throw error;

  voteCounts=new Map();
  myVotes=new Set();

  (data||[]).forEach(v=>{
    voteCounts.set(v.gift_id,(voteCounts.get(v.gift_id)||0)+1);
    if(v.user_id===currentUser.id)myVotes.add(v.gift_id);
  });

  updateLikeButtons();
  if(current==="🔥ランキング")render();
}

function decodeVoteId(id){
  const pos=id.indexOf("::");
  if(pos<0)return{gift:id,phrase:""};
  return{gift:id.slice(0,pos),phrase:id.slice(pos+2)};
}

function updateLikeButtons(){
  document.querySelectorAll("[data-like]").forEach(b=>{
    const id=decodeURIComponent(b.dataset.like);
    const count=voteCounts.get(id)||0;
    const on=myVotes.has(id);
    b.classList.toggle("on",on);
    b.textContent=`${on?"♥":"♡"} ${count}`;
    // Never hard-disable: tapping can retry connection.
    b.disabled=false;
    b.style.opacity=rankingReady?"1":"0.72";
  });
}

function bindLikeButtons(){
  document.querySelectorAll("[data-like]").forEach(b=>{
    const id=decodeURIComponent(b.dataset.like);

    b.onclick=async()=>{
      if(!rankingReady || !voteClient || !currentUser){
        const ok=await initRecommendations();
        if(!ok){
          alert("♡機能に接続できませんでした。\n\n"+(voteInitError||"原因不明")+"\n\n画面上の赤いエラー表示をスクショして送ってね。");
          return;
        }
      }

      b.style.pointerEvents="none";
      try{
        if(myVotes.has(id)){
          const {error}=await voteClient
            .from("gift_votes")
            .delete()
            .eq("gift_id",id)
            .eq("user_id",currentUser.id);
          if(error)throw error;
        }else{
          const {error}=await voteClient
            .from("gift_votes")
            .insert({gift_id:id,user_id:currentUser.id});
          if(error)throw error;
        }

        await loadVotes();
      }catch(e){
        console.error("Vote error:",e);
        const msg=e?.message||String(e);
        setVoteStatus("⚠️ 投票エラー："+msg,"err");
        alert("♡の更新に失敗しました。\n\n"+msg);
      }finally{
        b.style.pointerEvents="";
      }
    };
  });

  updateLikeButtons();
}

search.oninput=render;
renderChips();
render();
initRecommendations();
</script>
</body></html>
